name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test
      - name: Run synthetic pipe review
        run: node src/cli.js review-pipes examples/table-pipes.md
      - name: Run synthetic update demo
        run: node examples/update-demo.js
      - name: Run synthetic content diff demo
        run: node examples/diff-demo.js
      - name: Run example
        run: node src/cli.js check ./examples/source ./examples/installed
      - name: Exercise the composite action
        uses: ./
        with:
          source: ./examples/source
          installed: ./examples/installed

  zip-review:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s test -p 'test_skill_zip.py' -v

  web-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node web-tests/browser.mjs
      - run: node web-tests/diff-browser.mjs
