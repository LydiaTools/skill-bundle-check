name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test
      - name: Run example
        run: node src/cli.js check ./examples/source ./examples/installed
      - name: Exercise the composite action
        uses: ./
        with:
          source: ./examples/source
          installed: ./examples/installed
      - name: Confirm the CLI rejects a broken bundle
        id: broken_bundle
        continue-on-error: true
        run: node src/cli.js check ./examples/source ./examples/installed-missing 2> "$RUNNER_TEMP/broken-bundle.log"
      - name: Assert the broken bundle failed
        if: always()
        env:
          RESULT: ${{ steps.broken_bundle.outcome }}
        run: |
          test "$RESULT" = failure
          grep -q '^REFERENCE_MISSING_FROM_INSTALL' "$RUNNER_TEMP/broken-bundle.log"
