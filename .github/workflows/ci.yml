name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test
      - name: Run synthetic pipe review
        run: node src/cli.js review-pipes examples/table-pipes.md
      - name: Run synthetic update demo
        run: node examples/update-demo.js
      - name: Run example
        run: node src/cli.js check ./examples/source ./examples/installed
      - name: Exercise the composite action
        uses: ./
        with:
          source: ./examples/source
          installed: ./examples/installed
